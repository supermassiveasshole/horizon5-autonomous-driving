<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>道路候选回放</title>
<style>body{background:#101923;color:#e6edf4;font:16px system-ui;margin:24px;max-width:1100px}img{width:100%;display:block}.stage{position:relative;max-width:960px}.stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}pre{white-space:pre-wrap}input{width:60%}button{font:inherit;padding:8px}#summary{background:#233244;padding:15px}#state{color:#f6d87f}details{margin-top:16px}</style>
<h1>像素道路候选</h1><p>绿：路面；黄：路肩/人行道候选；红：障碍候选；紫：未知。分数未经校准，不是道路真值。</p>
<p id="summary"></p><button id="play">播放</button> <button id="overlay">切换原图/估计</button><input id="seek" type="range" value="0" aria-label="道路回放位置"><p id="state"></p><div class="stage"><img id="image" alt="道路观测"><canvas id="edges"></canvas></div><p>青线：左边界候选；黄线：右边界候选。断点保留，不连接缺失端点。像素边界尚未校准为道路宽度。</p><details><summary>本帧记录</summary><pre id="details"></pre></details><details><summary>误差、覆盖与使用门槛</summary><pre id="evaluation"></pre></details>
<script id="data" type="application/json"><!--PERCEPTION_DATA--></script>
<script>
const d=JSON.parse(document.getElementById('data').textContent),e=id=>document.getElementById(id);let i=0,overlay=true,timer=null;
e('seek').max=Math.max(0,d.frames.length-1);
const metrics=d.evaluation,ms=v=>v==null?'—':v.toFixed(1);
e('summary').textContent=`${d.model.method} · ${d.frames.length} 帧 · 推理 p95 ${ms(metrics.inference_ms.p95)} ms · ${metrics.status==='awaiting_independent_labels'?'等待独立人工标签':'已计算核验误差'} · ${d.geometry_ready?'达到继续几何验证门槛':'未达到继续几何验证门槛'}`;
e('evaluation').textContent=JSON.stringify(metrics,null,2);
function drawEdges(f){const canvas=e('edges');canvas.width=f.size[0];canvas.height=f.size[1];const ctx=canvas.getContext('2d');if(!overlay||f.status!=='ok')return;for(const side of ['left','right']){ctx.strokeStyle=side==='left'?'#40efff':'#ffe45e';ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=3;let previous=null;for(const b of f.boundaries){if(b[side]===null){previous=null;continue;}if(previous){ctx.beginPath();ctx.moveTo(previous[0],previous[1]);ctx.lineTo(b[side],b.y);ctx.stroke();}ctx.beginPath();ctx.arc(b[side],b.y,4,0,Math.PI*2);ctx.fill();previous=[b[side],b.y];}}}
function show(){const f=d.frames[i];if(!f){e('state').textContent='没有画面';return;}e('seek').value=i;e('state').textContent=`${i+1}/${d.frames.length} · ${f.id} · ${ms(f.speed_kmh)} km/h · ${f.status} · ${f.stale?'结果过期 · ':''}${f.source_observation?'原始观测：'+f.source_observation+' · ':''}离线估计，不用于控制`;const url=(overlay?f.overlay_url:null)||f.image_url;e('image').hidden=!url;if(url)e('image').src=url;else e('image').removeAttribute('src');e('details').textContent=JSON.stringify(f,null,2);drawEdges(f);}
function stop(){clearTimeout(timer);timer=null;e('play').textContent='播放';}
function advance(){if(i+1>=d.frames.length){stop();return;}const a=d.frames[i],b=d.frames[i+1],delay=a.clip===b.clip?Math.max(1,(b.capture_start_ns-a.capture_start_ns)/1e6):500;timer=setTimeout(()=>{i++;show();advance();},delay);}
e('seek').oninput=()=>{stop();i=+e('seek').value;show();};e('overlay').onclick=()=>{overlay=!overlay;show();};e('play').onclick=()=>{if(timer){stop();return;}if(i+1>=d.frames.length)i=0;e('play').textContent='暂停';show();advance();};e('image').onerror=()=>{e('state').textContent+=' · 图片读取失败';e('edges').getContext('2d').clearRect(0,0,e('edges').width,e('edges').height);};show();
</script></html>

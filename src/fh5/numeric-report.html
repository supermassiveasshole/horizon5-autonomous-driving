<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>数值输入与预测回放</title>
<style>
:root{color-scheme:dark;font:15px/1.55 system-ui,sans-serif;background:#101721;color:#e2eaf5}
body{max-width:1400px;margin:auto;padding:24px}h1{font-size:26px;margin-bottom:4px}
.muted{color:#aab9cd}button{background:#213c55;color:inherit;border:1px solid #53728d;border-radius:6px;padding:8px 16px;cursor:pointer}
.controls{display:flex;align-items:center;gap:16px;background:#1c2939;padding:14px;border-radius:10px;position:sticky;top:0;z-index:1}
input{flex:1;min-width:100px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:18px 0}
figure{margin:0;padding:12px;background:#1c2939;border-radius:10px;overflow-wrap:anywhere}
.image{aspect-ratio:16/9;display:grid;place-items:center;background:#080e17}img{width:100%;height:100%;object-fit:contain}
figcaption{font-size:13px;margin-top:8px;color:#b8c8de;white-space:pre-wrap}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;background:#172334;padding:14px;border-radius:8px}
#result{border-left:3px solid #69b9df;padding:10px 16px}details{margin:12px 0}summary{cursor:pointer}
</style>
<h1>数值输入与预测回放</h1>
<p class="muted">离线诊断 · 未发送驾驶输入。图片是实际数值像素的独立展示副本；模型不读取展示图片。</p>
<p id="notice"></p>
<div class="controls"><button id="play" type="button">播放</button><label for="index">决策</label><input id="index" type="range" min="0" value="0"><output id="position"></output></div>
<div id="result" aria-live="polite"></div><div id="cards" class="cards"></div>
<details open><summary>本次输入、时间与预测</summary><pre id="metadata"></pre></details>
<details><summary>像素契约与模型版本</summary><pre id="contract"></pre></details>
<details><summary>运行与存档完整性</summary><pre id="integrity"></pre></details>
<details id="metrics-section"><summary>离线训练与分组误差（不代表驾驶能力）</summary><pre id="metrics"></pre></details>
<script>
const data=/*NUMERIC_DATA*/null;
const rows=data.decisions, slider=document.querySelector('#index'), play=document.querySelector('#play');
let cursor=0, playing=false, generation=0, timer=null;
const cache=new Map();
const text=(id,value)=>{document.getElementById(id).textContent=value;};
text('contract',JSON.stringify({contract:data.contract,model:data.model,availability_note:data.availability_note},null,2));
text('integrity',JSON.stringify({pipeline:data.pipeline,timing_kind:data.timing_kind,resources_released:data.resources_released,archive:data.archive,stop_reason:data.stop_reason,execution_error:data.execution_error,replay_errors:data.replay_errors,replay_tolerance:data.replay_tolerance},null,2));
document.getElementById('metrics-section').hidden=!data.metrics;
text('metrics',JSON.stringify({training:data.training,metrics:data.metrics},null,2));
text('notice',data.model?.diagnostic_only || data.diagnostic_only ? '旧数据兼容诊断：尚未验证新采集分布、实时性或驾驶能力。' : '数值接口诊断：不构成实时驾驶验收。');
slider.max=Math.max(0,rows.length-1);slider.disabled=play.disabled=!rows.length;
function loadImage(url){
  if(!url)return Promise.resolve(null);
  if(!cache.has(url)){
    cache.set(url,new Promise(resolve=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>resolve(null);img.src=url;}));
    while(cache.size>24)cache.delete(cache.keys().next().value);
  }
  return cache.get(url);
}
function pause(){playing=false;play.textContent='播放';clearTimeout(timer);}
async function show(index){
  clearTimeout(timer);const token=++generation;cursor=index;slider.value=index;
  const row=rows[index];if(!row){text('result','没有可查看的决策。');return;}
  const pictures=await Promise.all(row.frames.map((_,i)=>loadImage(row.preview_urls[i])));
  if(token!==generation)return;
  text('position',`${index+1} / ${rows.length}`);
  text('result',`${row.decision_id} · ${row.status || '离线准备'} · ${row.replay_error || row.reason || (row.exact_replay_available ? '数值存档完整' : row.archive_reason || '待推理')} · 预测 ${JSON.stringify(row.replayed_prediction || row.prediction || null)} · 示范动作 ${JSON.stringify(row.supervision?.action || null)}（仅供比较）`);
  const cards=document.getElementById('cards'), fragment=document.createDocumentFragment();
  row.frames.forEach((frame,i)=>{
    const figure=document.createElement('figure'), box=document.createElement('div'), caption=document.createElement('figcaption');box.className='image';
    if(pictures[i]){const img=pictures[i].cloneNode();img.alt=`历史 ${i+1}：${frame.frame_id}`;box.append(img);}else{box.textContent='展示副本缺失；不替换实际模型输入';}
    const age=row.timing ? row.timing.image_age_s[i]*1000 : (row.decision_ns-frame.source_time_ns)/1e6;
    const delta=row.timing && i>0 ? ` · 相邻 Δt ${(row.timing.adjacent_delta_s[i-1]*1000).toFixed(3)} ms` : '';
    caption.textContent=`${i+1}. ${frame.frame_id}\n图像年龄 ${age.toFixed(3)} ms${delta} · ${frame.size.join('×')} RGB\n${frame.time_quality} · ${frame.epoch}`;
    figure.append(box,caption);fragment.append(figure);
  });cards.replaceChildren(fragment);
  const {preview_urls,...metadata}=row;text('metadata',JSON.stringify(metadata,null,2));
  if(playing){
    if(cursor+1>=rows.length){pause();return;}
    const interval=Math.max(30,Math.min(500,(rows[cursor+1].decision_ns-row.decision_ns)/1e6));
    timer=setTimeout(()=>show(cursor+1),interval);
  }
}
slider.addEventListener('input',()=>{pause();show(Number(slider.value));});
play.addEventListener('click',()=>{if(playing){pause();return;}playing=true;play.textContent='暂停';show(cursor+1>=rows.length?0:cursor);});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});show(0);
</script></html>

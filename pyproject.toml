[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "horizon5-autonomous-driving"
version = "0.1.0"
description = "Record and replay FH5 driving experiments"
requires-python = ">=3.12,<3.15"
dependencies = []

[project.scripts]
fh5 = "fh5.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "mypy>=1.11,<2", "ruff>=0.6,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/fh5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/fh5"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
